server:
  port: 8080
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@userKeyResolver}"
      routes:
        - id: user
          uri: lb://USER-SERVICE
          predicates: [ "Path=/api/auth/**,/api/users/**,/api/admin/**,/oauth2/**,/login/oauth2/**" ]
        - id: product
          uri: lb://PRODUCT-SERVICE
          predicates: [ "Path=/api/products/**" ]
        - id: cart
          uri: lb://CART-SERVICE
          predicates: [ "Path=/api/cart/**" ]
        - id: order
          uri: lb://ORDER-SERVICE
          predicates: [ "Path=/api/orders/**" ]
        - id: payment
          uri: lb://PAYMENT-SERVICE
          predicates: [ "Path=/api/payments/**" ]
        - id: inventory
          uri: lb://INVENTORY-SERVICE
          predicates: [ "Path=/api/inventory/**" ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
