server:
  port: 8083
spring:
  application:
    name: cart-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
