name: ci-cd
on:
  push: { branches: [ main ] }
  pull_request:
env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: shopsphere
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B verify
  docker-deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    strategy:
      matrix:
        service: [ discovery-server, api-gateway, user-service, product-service, cart-service, order-service, payment-service, inventory-service, notification-service ]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push image
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/shopsphere/${{ matrix.service }}
          docker build --build-arg MODULE=${{ matrix.service }} -t $IMG:${{ github.sha }} .
          docker push $IMG:${{ github.sha }}
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
          export ECR_REGISTRY=${{ steps.ecr.outputs.registry }} IMAGE_TAG=${{ github.sha }}
          envsubst < k8s/${{ matrix.service }}.yaml | kubectl apply -f -
          kubectl -n shopsphere rollout status deploy/${{ matrix.service }} --timeout=180s
