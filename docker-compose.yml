# Local dev: one MySQL container hosts 5 logical DBs (one per service). In prod use separate RDS instances/schemas.
x-common: &common
  environment: &env
    DB_HOST: mysql
    REDIS_HOST: redis
    KAFKA_SERVERS: kafka:9092
    EUREKA_URL: http://discovery-server:8761/eureka
    JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-32b}
    RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxx}
    RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-secret}
    RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec}
    RAZORPAY_MOCK: ${RAZORPAY_MOCK:-true}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy}
services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: root }
    volumes: [ "./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql" ]
    healthcheck: { test: ["CMD","mysqladmin","ping","-proot"], interval: 5s, retries: 20 }
    ports: [ "3306:3306" ]
  redis:
    image: redis:7
    ports: [ "6379:6379" ]
  kafka:
    image: apache/kafka:3.7.0
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    <<: *common
    ports: [ "8761:8761" ]
  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    <<: *common
    ports: [ "8080:8080" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  user-service:
    build: { context: ., args: { MODULE: user-service } }
    <<: *common
    ports: [ "8081:8081" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  product-service:
    build: { context: ., args: { MODULE: product-service } }
    <<: *common
    ports: [ "8082:8082" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  cart-service:
    build: { context: ., args: { MODULE: cart-service } }
    <<: *common
    ports: [ "8083:8083" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  order-service:
    build: { context: ., args: { MODULE: order-service } }
    <<: *common
    ports: [ "8084:8084" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  payment-service:
    build: { context: ., args: { MODULE: payment-service } }
    <<: *common
    ports: [ "8085:8085" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  inventory-service:
    build: { context: ., args: { MODULE: inventory-service } }
    <<: *common
    ports: [ "8086:8086" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    <<: *common
    ports: [ "8087:8087" ]
    depends_on: [ discovery-server, mysql, redis, kafka ]
