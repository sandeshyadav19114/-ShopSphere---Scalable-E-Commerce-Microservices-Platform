apiVersion: apps/v1
kind: Deployment
metadata: { name: product-service, namespace: shopsphere }
spec:
  replicas: 2
  selector: { matchLabels: { app: product-service } }
  template:
    metadata: { labels: { app: product-service } }
    spec:
      containers:
        - name: product-service
          image: ${ECR_REGISTRY}/shopsphere/product-service:${IMAGE_TAG}
          ports: [ { containerPort: 8082 } ]
          envFrom: [ { configMapRef: { name: shopsphere-config } }, { secretRef: { name: shopsphere-secrets } } ]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 40, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 70, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: shopsphere }
spec: { selector: { app: product-service }, ports: [ { port: 8082, targetPort: 8082 } ] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: product-service, namespace: shopsphere }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: product-service }
  minReplicas: 2
  maxReplicas: 8
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } } ]
